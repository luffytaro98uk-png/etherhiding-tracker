[project]
name = "etherhiding-tracker"
version = "1.0.0"
description = "Detect and track EtherHiding malware infrastructure on the Polygon blockchain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "blockchain", "malware", "polygon", "threat-intelligence"]

dependencies = [
    "web3>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rlp>=4.0.0",
    "eth-utils",
]
